// Nära bild: rita med K px/enhet och beskär till det som ritats
function bbox(R) {
  let x0 = R.w, y0 = R.h, x1 = -1, y1 = -1; const d = R.data;
  for (let y = 0; y < R.h; y++) for (let x = 0; x < R.w; x++) if (d[(y * R.w + x) * 4 + 3]) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : { x: x0, y: y0, w: x1 - x0 + 1, h: y1 - y0 + 1 };
}
const ANCH = { cpu: [3, 30, 0.2], cooler: [3, 30, 0.2], ram: [4, 28, 0.1], storage: [2, 30, 0], media: [1, 29, 0.3], gpu: [4, 29, 0.1], sound: [4, 29, 0.1], psu: [1, 29, 0], fans: [2, 30, 0.1] };
function draw(R, p, o) {
  if (p.cat === 'case') return drawCaseStanding(R, p, o, [0, 0, 0]);
  const oo = anchored && ANCH[p.cat] ? { ...o, at: ANCH[p.cat] } : o;
  return drawPart(R, p, oo);
}
function closeup(p) {
  const o = { ids: {}, id: 1, spin: 0.4, t: 1.2, showroom: true, loose: true, leverClosed: true };
  const s = 4, Rq = new Raster(900, 900);
  Object.assign(Rq, { k: s, hz: s * 13 / 16, ox: 450, oy: 300, edges: true }); Rq.clear();
  draw(Rq, p, o);
  const b = bbox(Rq); if (!b) return document.createElement('canvas');
  const f = K / s, pad = 6;
  const R = new Raster(Math.ceil(b.w * f) + pad * 2, Math.ceil(b.h * f) + pad * 2);
  Object.assign(R, { k: K, hz: K * 13 / 16, ox: pad + (Rq.ox - b.x) * f, oy: pad + (Rq.oy - b.y) * f, edges: true });
  R.clear();
  const t0 = performance.now();
  draw(R, p, o);
  R.ms = performance.now() - t0;
  const c = R.flush(); c.title = Math.round(R.ms) + ' ms'; c.dataset.ms = R.ms;
  return c;
}

const out = document.getElementById('out');
const times = {};
for (const cat of cats) {
  const h = document.createElement('h2'); h.textContent = cat + (anchored ? ' (o.at)' : ''); out.append(h);
  const row = document.createElement('div'); row.className = 'row'; out.append(row);
  for (const p of S[cat] || []) {
    const card = document.createElement('div'); card.className = 'card';
    const lab = document.createElement('b');
    const st = p.look.style || p.look.pkg || p.look.type || p.look.front || '';
    card.append(lab);
    try {
      if (showIcons) { const ic = iconCanvas(p, 96, 80); ic.className = 'ic'; card.append(ic); }
      const cu = closeup(p); cu.className = 'cu'; card.append(cu);
      times[p.id] = +cu.dataset.ms;
      lab.textContent = `${p.name} [${st}] ${Math.round(cu.dataset.ms)}ms`;
    } catch (e) { lab.textContent = `${p.name} FEL: ${e.message}`; console.error(e); }
    row.append(card);
  }
}
window.times = times;
// Positionsoberoende: samma del på standardplats och på ett annat ankare ska ge lika stor bild
window.checkAnchors = () => {
  const out = [];
  const size = (p, at) => {
    const R = new Raster(1400, 1400); Object.assign(R, { k: 6, hz: 6 * 13 / 16, ox: 700, oy: 400, edges: true }); R.clear();
    const o = { ids: {}, id: 1, spin: 0.4, t: 1.2, showroom: true, loose: true, leverClosed: true };
    drawPart(R, p, at ? { ...o, at } : o);
    const b = bbox(R); return b ? [b.w, b.h] : [0, 0];
  };
  for (const cat of Object.keys(ANCH)) for (const p of S[cat] || []) {
    const a = size(p, null), b = size(p, ANCH[cat]);
    if (Math.abs(a[0] - b[0]) > 2 || Math.abs(a[1] - b[1]) > 2) out.push(`${p.name}: ${a} vs ${b}`);
  }
  return out;
};
